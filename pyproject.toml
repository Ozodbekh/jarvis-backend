[project]
name = "jarvis-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.158",
    "fastapi[standard]>=0.141.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.3",
    "openwakeword>=0.4.0",
    "piper-tts>=1.8.0",
    "pydantic-settings>=2.15.0",
    "pyside6>=6.11.2",
    "structlog>=26.1.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config -m 'not live'"
filterwarnings = ["error"]
markers = [
    "slow: slower than a second",
    "live: talks to a real Claude session; manual only, never in make check",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG", "RUF001"]
"app/integrations/tts/uzbek.py" = ["RUF001"]
"desktop/window.py" = ["RUF001"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "openwakeword.*", "transformers.*", "ctranslate2.*"]
ignore_missing_imports = true
